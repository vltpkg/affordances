<!doctype html>
<html><head><title>General settings</title></head>
<body><main>
  <h1>General settings</h1>
  <form data-affordances-md="values" action="/settings" method="post">
    <input type="hidden" name="csrf" value="tok_settings_csrf_1" />
    <label for="name">Display name</label>
    <input id="name" name="name" value="Acme Inc" />
    <label for="contact">Contact email</label>
    <input id="contact" type="email" name="contact" value="ops@acme.test" />
    <label for="region">Region</label>
    <select id="region" name="region">
      <option value="us">United States</option>
      <option value="eu" selected>Europe</option>
    </select>
    <label for="tz">Time zone</label>
    <select id="tz" name="tz"><option>UTC</option><option>PST</option></select>
    <fieldset>
      <legend>Profile</legend>
      <label><input type="checkbox" name="public" checked /> Public profile</label>
      <label><input type="checkbox" name="beta" /> Beta features</label>
    </fieldset>
    <label for="bio">Bio</label>
    <textarea id="bio" name="bio">We make anvils.</textarea>
    <label for="pw">New password</label>
    <input id="pw" type="password" name="new-password" value="pw-s3cret-value" />
    <label for="key">Deploy key</label>
    <input id="key" name="api_key" value="key-live-0123456789" />
    <label for="code">Code</label>
    <input id="code" name="code" autocomplete="one-time-code" value="845221" />
    <label for="pw2">Old password</label>
    <input id="pw2" type="Password" name="p" value="UPPER-PW-LEAK" />
    <input type="HIDDEN" name="x" value="HIDDEN-LEAK" />
    <label for="card">Card</label>
    <input id="card" name="card" autocomplete="cc-number" value="4111111111111111" />
    <label for="plan">Plan</label>
    <input id="plan" type="TEXT" name="plan" value="Pro" />
    <button type="submit">Save</button>
  </form>
</main></body></html>
