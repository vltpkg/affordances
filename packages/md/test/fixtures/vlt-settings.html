<!doctype html>
<!-- shaped like vlt.io's /settings/[account]/general: shadcn cards around radix Switch, Checkbox, RadioGroup and Select -->
<html><head><title>General settings</title></head>
<body><main>
  <h1>Settings</h1>
  <form data-affordances-md="values" aria-labelledby="general-title" action="/settings/acme/general" method="post">
    <div class="rounded-xl border bg-card">
      <div class="flex flex-col gap-1.5 p-6">
        <h3 id="general-title" class="font-semibold">General</h3>
        <p class="text-sm text-muted-foreground">How your account appears on vlt.</p>
      </div>
      <div class="p-6 pt-0">
        <div id="display-name-title" class="font-medium">Display name</div>
        <input aria-labelledby="display-name-title" name="displayName" value="Acme Inc" class="flex h-9 w-full" />
        <p class="text-sm text-muted-foreground">Max 32 characters.</p>
      </div>
      <div class="p-6 pt-0">
        <span id="support-title" class="font-medium">Support</span>
        <span id="support-kind" class="sr-only">email</span>
        <input type="email" aria-labelledby="support-title missing-id support-kind" name="support" value="support@acme.dev" />
      </div>
      <div class="p-6 pt-0">
        <label for="github">GitHub</label>
        <input id="github" name="github" value="https://github.com/acme" />
      </div>
    </div>
  </form>
  <form data-affordances-md="values" aria-label="Security">
    <div class="flex items-center justify-between">
      <label for="private-account">Private account</label>
      <button type="button" role="switch" aria-checked="true" data-state="checked" value="on" class="peer inline-flex h-5 w-9" id="private-account"><span data-state="checked" class="pointer-events-none block h-4 w-4"></span></button>
      <input type="checkbox" aria-hidden="true" tabindex="-1" style="transform:translateX(-100%);position:absolute;pointer-events:none;opacity:0;margin:0" value="on" checked />
    </div>
    <div class="flex items-center justify-between">
      <label for="require-2fa">Require 2FA</label>
      <button type="button" role="switch" aria-checked="false" data-state="unchecked" value="on" id="require-2fa"><span data-state="unchecked"></span></button>
      <input type="checkbox" aria-hidden="true" tabindex="-1" style="position:absolute;opacity:0" value="on" />
    </div>
    <div class="flex items-center gap-2">
      <button type="button" role="checkbox" aria-checked="true" data-state="checked" value="on" id="audit-log"><span data-state="checked"><svg></svg></span></button>
      <input type="checkbox" aria-hidden="true" tabindex="-1" style="position:absolute;opacity:0" value="on" checked />
      <label for="audit-log">Keep an audit log</label>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" role="checkbox" aria-checked="mixed" data-state="indeterminate" aria-label="Notify all members"></button>
    </div>
    <button type="button" aria-pressed="false" data-state="off">Compact view</button>
  </form>
  <form data-affordances-md="values">
    <h3>Publishing</h3>
    <p>Who can publish packages under @acme.</p>
    <label id="who-label">Publishers</label>
    <div role="radiogroup" aria-labelledby="who-label" class="grid gap-2">
      <div class="flex items-center gap-2"><button type="button" role="radio" aria-checked="false" data-state="unchecked" value="owners" id="who-owners"></button><label for="who-owners">Owners</label></div>
      <div class="flex items-center gap-2"><button type="button" role="radio" aria-checked="true" data-state="checked" value="members" id="who-members"></button><label for="who-members">All members</label></div>
      <div class="flex items-center gap-2"><button type="button" role="radio" aria-checked="false" value="ci" id="who-ci" disabled></button><label for="who-ci">CI only</label></div>
      <input type="radio" aria-hidden="true" tabindex="-1" style="position:absolute;opacity:0" value="members" checked />
    </div>
    <label for="region">Region</label>
    <button type="button" role="combobox" aria-controls="radix-r1" aria-expanded="false" aria-autocomplete="none" dir="ltr" data-state="closed" id="region"><span style="pointer-events:none">Europe</span><svg></svg></button>
    <select aria-hidden="true" tabindex="-1" style="position:absolute;border:0;width:1px;height:1px"><option value="eu" selected>Europe</option></select>
    <label for="tz">Time zone</label>
    <button type="button" role="combobox" aria-expanded="false" data-state="closed" data-placeholder="" id="tz"><span style="pointer-events:none">Pick a time zone</span></button>
    <label for="deploy-key">Deploy key</label>
    <button type="button" role="combobox" aria-expanded="false" id="deploy-key"><span>dk_live_LEAK</span></button>
    <p>Changes apply to new publishes.</p>
  </form>
</main></body></html>
