<!doctype html>
<html>
  <head>
    <title>Dashboard</title>
  </head>
  <body>
    <main>
      <div class="toolbar"><p>Filters and sort</p></div>
      <afford-md data-mode="main" style="display: contents">
        <h1>Orders</h1>
        <p>Two open orders.</p>
        <afford-md data-mode="skip" style="display: contents"><p>Internal note</p></afford-md>
        <afford-md data-mode="main" style="display: contents"
          ><p>Nested main is part of the outer one.</p></afford-md
        >
      </afford-md>
      <div class="sidebar"><p>Help</p></div>
      <afford-md data-mode="main" style="display: contents"
        ><h2>Archive</h2>
        <p>Older orders.</p></afford-md
      >
    </main>
  </body>
</html>
