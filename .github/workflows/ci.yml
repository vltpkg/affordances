name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g vlt
      - run: vlt install --frozen-lockfile
      - run: vlr fmt:check
      - run: vlr lint
      - run: vlr build
      - run: vlr typecheck
      - run: vlr test
